services:
  qwen25-omni:
    image: vllm/vllm-omni-rocm:v0.28.0
    container_name: qwen25-omni-rocm
    ports:
      - "8091:8091"
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    ipc: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - MIOPEN_FIND_MODE=FAST
      - TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1
      - HIP_VISIBLE_DEVICES=0
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - ./qwen25_single_gpu.yaml:/app/qwen25_single_gpu.yaml:ro
    entrypoint: ["vllm", "serve", "--omni"]
    command: >
      Qwen/Qwen2.5-Omni-7B
      --port 8091
      --host 0.0.0.0
      --init-timeout 3600
      --stage-init-timeout 1800
      --deploy-config /app/qwen25_single_gpu.yaml
    restart: unless-stopped

volumes:
  huggingface_cache:
