services:
  qwen3-omni:
    image: vllm/vllm-omni-rocm:v0.28.0
    container_name: qwen3-omni-rocm
    ports:
      - "8091:8091"
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    ipc: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - MIOPEN_FIND_MODE=FAST
      - TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1
      - HIP_VISIBLE_DEVICES=0
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    entrypoint: ["vllm", "serve", "--omni"]
    command: >
      Qwen/Qwen3-Omni-30B-A3B-Instruct
      --port 8091
      --host 0.0.0.0
      --init-timeout 3600
      --stage-init-timeout 1800
      --deploy-config vllm_omni/deploy/qwen3_omni_moe_thinking.yaml
      --stage-id 0
      --gpu-memory-utilization 0.85
    restart: unless-stopped

volumes:
  huggingface_cache:
